services:
  legalgraphrag-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Default to CPU torch wheel for fast builds and lightweight footprint.
        # Switch to "https://download.pytorch.org/whl/cu124" if enabling GPU reservations below.
        TORCH_INDEX_URL: "https://download.pytorch.org/whl/cpu"
    image: legalgraphrag-procurement-mcp:latest
    container_name: legalgraphrag-mcp
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      DOTENV_PATH: .env
      PYTHONPATH: /app
      HF_HOME: /app/.cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      # Generated corpus/index artifacts mounted read-write
      - ./outputs:/app/outputs
      - ./datasets:/app/datasets
      - ./logs:/app/logs
      # Persistent HuggingFace model cache (rerankers / tokenizers)
      - hf_cache:/app/.cache/huggingface
      # Source data & env mounted read-only
      - ./datas:/app/datas
      - ./procurement_data:/app/procurement_data:ro
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Uncomment to use the GPU cross-encoder reranker (requires NVIDIA Container Toolkit on host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

volumes:
  hf_cache:
    driver: local

services:
  procurement-qa:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Default to CPU torch wheel for fast builds and lightweight footprint.
        TORCH_INDEX_URL: "https://download.pytorch.org/whl/cpu"
    container_name: procurement-mcp
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      DOTENV_PATH: .env
      PYTHONPATH: /app
      HF_HOME: /app/.cache/huggingface
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      NEO4J_URI: bolt://neo4j:7687
      USE_TRI_STORE: "true"
    ports:
      - "8000:8000"
    volumes:
      # Generated corpus/index artifacts mounted read-write
      - ./outputs:/app/outputs
      - ./datasets:/app/datasets
      - ./logs:/app/logs
      # Persistent HuggingFace model cache (rerankers / tokenizers)
      - hf_cache:/app/.cache/huggingface
      # Source data & env mounted read-only
      - ./datas:/app/datas
      - ./procurement_data:/app/procurement_data:ro
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Uncomment to use the GPU cross-encoder reranker (requires NVIDIA Container Toolkit on host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: procurement-postgres
    environment:
      POSTGRES_DB: procurement_rag
      POSTGRES_USER: procurement_user
      POSTGRES_PASSWORD: procurement_secret123
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement_user -d procurement_rag"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: procurement-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    container_name: procurement-neo4j
    environment:
      - NEO4J_AUTH=neo4j/procurement_secret123
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"   # Neo4j Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

volumes:
  hf_cache:
    driver: local
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
